name: Architecture Guardian AI Review
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Pull request number to review (read-only)'
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review proposed changes against current architecture
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python3 tools/architecture-guardian/ai_review.py
