name: Instructor parity gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  instructor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared Instructor capabilities
        run: python scripts/check-instructor-parity.py
