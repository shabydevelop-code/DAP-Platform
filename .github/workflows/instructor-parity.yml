name: Instructor parity gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  instructor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared Instructor runtime capabilities
        run: python scripts/check-instructor-parity.py
      - name: Test shared Instructor UI and locator transitions
        run: node --test scripts/tests/instructor-any-value.test.cjs
