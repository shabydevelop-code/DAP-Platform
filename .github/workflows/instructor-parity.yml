name: Instructor parity gate

on:
  workflow_dispatch:

jobs:
  instructor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared Instructor capabilities
        run: python scripts/check-instructor-parity.py
