<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css"><title>כותרת</title></head>
<body class="header-page"><header id="portal-header" role="link" tabindex="0"><strong>Sample Application</strong><span>יישום לדוגמה</span></header>
<script>
const portal=()=>{const frame=parent.document.getElementById('content-frame');frame.src='/content.html#/'};
document.querySelector('#portal-header').addEventListener('click',portal);
document.querySelector('#portal-header').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();portal()}});
</script></body></html>
