<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAP Test CRM</title><link rel="stylesheet" href="/app.css"></head>
<body class="shell">
<iframe id="header-frame" name="dap-header" src="/header.html" title="כותרת המערכת"></iframe>
<iframe id="content-frame" name="dap-content" src="/content.html" title="תוכן המערכת"></iframe>
<script>
function replaceContentFrame(hash){
  const old=document.querySelector('#content-frame');
  if(!old)return;
  const next=document.createElement('iframe');
  next.id='content-frame-next';
  next.name='dap-content';
  next.title='תוכן המערכת';
  next.className='content-frame-next';
  next.src='/content.html'+hash;
  next.addEventListener('load',()=>{
    old.id='content-frame-old';
    old.name='dap-content-old';
    next.id='content-frame';
    old.remove();
    next.classList.remove('content-frame-next');
  },{once:true});
  old.insertAdjacentElement('afterend',next);
}
</script>
</body>
</html>
