<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="guideme-session" content="__SESSION_TOKEN__">
  <title>GuideMe — Instructor</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=1">
  <link rel="stylesheet" href="/style.css">
  <script src="/main.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">דלג לתוכן הראשי</a>
<div class="shell">
  <main id="main-content" tabindex="-1">
    <header class="topbar"><div class="brand-heading"><strong>GuideMe <span>Instructor</span></strong></div><div class="top-actions"><span id="save-status" class="pill save-status" role="status" aria-live="polite">כל השינויים נשמרו</span><span id="capture-status" class="pill connection-status" role="status" aria-live="polite">תוסף: בודק חיבור</span></div></header>
    <div class="content">
      
      <div id="notice" class="notice hidden" role="status" aria-live="polite" aria-atomic="true"></div>
      <section id="list-view">
        
        <div class="panel"><div class="panel-header"><div><h1 id="library-title" tabindex="-1">ספריית לומדות <span class="guide-count" id="total-guides">—</span></h1><p>בחר לומדה כדי לצפות בשלבים ולנהל אפליקציות.</p></div><label class="visually-hidden" for="guide-search">חיפוש לומדה לפי שם או מזהה</label><input id="guide-search" class="search" placeholder="חיפוש לפי שם או מזהה..."><button id="new-guide" class="btn primary">＋ יצירת לומדה</button></div><div id="guides-table" class="table-area"></div></div>
      </section>
      <section id="detail-view" class="hidden">
        <div class="detail-top"><button class="back" id="back">← חזרה לכל הלומדות</button></div>
        <div class="panel guide-card"><div class="guide-top"><div><div class="eyebrow">לומדה נבחרת</div><h1 id="detail-name" tabindex="-1"></h1><p id="detail-description"></p></div><div class="guide-actions"><button class="btn secondary" id="rename-guide">שינוי שם</button><button class="btn danger" id="delete-guide">מחיקת לומדה</button></div></div></div>
        <div class="tabs" role="tablist" aria-label="תוכן הלומדה"><button type="button" role="tab" aria-controls="steps-panel" aria-selected="true" class="tab active" data-tab="steps">שלבי הלומדה <span id="steps-count">0</span></button><button type="button" role="tab" aria-controls="contexts-panel" aria-selected="false" class="tab" data-tab="contexts">אפליקציות <span id="contexts-count">0</span></button></div>
        <div class="panel" id="steps-panel" role="tabpanel"><div class="panel-header"><div><h2>שלבים</h2><p>יצירת שלבים, עריכת תוכן ושיוך לאפליקציה.</p></div><div class="steps-toolbar"><label class="visually-hidden" for="step-search">חיפוש שלב בלומדה</label><input id="step-search" class="search" placeholder="חיפוש שלב..."><button id="new-step" class="btn primary">＋ הוספת שלב</button></div></div><div class="steps-layout"><div id="step-list" class="step-list" aria-label="רשימת שלבים"></div><div id="step-inspector" class="inspector"><div class="empty-inspector">בחר שלב להצגת הפרטים שלו</div></div></div></div>
        <div class="panel hidden" id="contexts-panel" role="tabpanel"><div class="panel-header"><div><h2>אפליקציות הלומדה</h2><p>הקשרים מזוהים בנפרד ל־Web ול־Windows.</p></div><button id="add-context" class="btn primary">＋ הוספת אפליקציה</button></div><div id="contexts-list" class="context-cards"></div></div>
      </section>
    </div>
  </main>
</div>
<dialog id="editor-dialog" aria-labelledby="dialog-title"><form method="dialog" id="editor-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-btn" type="button" aria-label="סגירת חלון העריכה">✕</button></div><div id="dialog-fields"></div><div class="dialog-actions"><button type="button" class="btn secondary" id="cancel-dialog">ביטול</button><button class="btn primary" id="submit-dialog" value="save" type="submit">שמירה</button></div></form></dialog>
</body></html>
